<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Artículos Deportivos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_productos' %}">Artículos Deportivos</a>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Usuario: {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% if messages %}
            {% for mensaje in messages %}
            <div class="alert alert-success">{{ mensaje }}</div>
            {% endfor %}
        {% endif %}
        {% block contenido %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        Desarrollado por Danitza Isla
    </footer>

</body>
</html>
